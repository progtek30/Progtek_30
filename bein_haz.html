<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ספירה לאחור ל-א' אלול</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-color: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 10px;
      font-weight: 700;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .time-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 16px;
      padding: 15px 10px;
      transition: transform 0.2s ease;
    }

    .time-box:hover {
      transform: translateY(-3px);
      border-color: var(--accent-color);
    }

    .number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 5px;
    }

    .label {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .info-footer {
      font-size: 0.95rem;
      color: var(--text-sub);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
    }

    .shofar-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      display: inline-block;
    }

    @media (max-width: 480px) {
      .countdown-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .number {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="shofar-icon">📯</div>
    <h1>חבר'ה בין הזמנים הגיע, ולנוחיותכם הכנתי שעון מדוייק שיראה לכם עוד כמה זמן נשאר לכם לחפוש. 
    <br>
<br>זמן נותר עד ראש חודש אלול:</h1>
    <p class="subtitle">ספירה בזמן אמת לפי השעון המקומי</p>

    <div class="countdown-grid">
      
      
      
      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="label">שניות</div>
      </div>
      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="label">דקות</div>
      </div>
      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="label">שעות</div>
      </div>
      <div class="time-box">
        <div class="number" id="days">00</div>
        <div class="label">ימים</div>
      </div>
    </div>

    <div class="info-footer" id="target-info">
      מחשב את תאריך א' אלול הקרוב...
    </div>
  </div>

  <script>
    let targetDate = null;

    // שליפת התאריך הלועזי של א' אלול הקרוב מ-Hebcal API
    async function fetchElulDate() {
      try {
        const response = await fetch('https://www.hebcal.com/converter?cfg=json&hy=5786&hm=Elul&hd=1'); 
        // במידה והשנה משתנה, API מזהה אוטומטית לפי לוח השנה העברי
        const now = new Date();
        
        // נבדוק את א' אלול של השנה העברית הנוכחית
        const resCurrentYear = await fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=off&mod=off&nx=off&year=now&month=x`);
        
        // פתרון דינמי: מחשבים את א' אלול הקרוב ביותר במילישניות
        const searchUrl = `https://www.hebcal.com/converter?cfg=json&gy=${now.getFullYear()}&gm=${now.getMonth()+1}&gd=${now.getDate()}&g2h=1`;
        const todayData = await fetch(searchUrl).then(r => r.json());
        
        let hYear = todayData.hy;
        if (todayData.hm === 'Elul' || todayData.hm === 'Tishrei') {
          // אם אנחנו כבר באלול או אחרי, היעד הוא א' אלול של השנה הבאה
          hYear++;
        }

        const elulUrl = `https://www.hebcal.com/converter?cfg=json&hy=${hYear}&hm=Elul&hd=1&h2g=1`;
        const elulData = await fetch(elulUrl).then(r => r.json());

        // א' אלול מתחיל בשקיעה של ערב החג (ל' אב), נקבע כברירת מחדל ל-19:00 בערב שלפני
        targetDate = new Date(elulData.gy, elulData.gm - 1, elulData.gd - 1, 19, 0, 0);
        
        document.getElementById('target-info').innerHTML = 
          `א' אלול תשפ"ו חל בערב יום <b>${elulData.gd - 1}/${elulData.gm}/${elulData.gy}</b> (בשקיעה)`;

        updateCountdown();
      } catch (error) {
        document.getElementById('target-info').innerText = "שגיאה בטעינת התאריך העברי, נסה לתרענן.";
      }
    }

    function updateCountdown() {
      if (!targetDate) return;

      const now = new Date();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.querySelector('.container').innerHTML = `
          <div class="shofar-icon">📯</div>
          <h1>חודש טוב ומבורך!</h1>
          <p class="subtitle">הגענו ל-א' אלול</p>
        `;
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((difference / 1000 / 60) % 60);
      const seconds = Math.floor((difference / 1000) % 60);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    // הפעלה ראשונית ועדכון כל שנייה
    fetchElulDate();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
